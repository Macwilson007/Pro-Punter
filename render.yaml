services:
  - type: web
    name: pro-punter-api
    runtime: python
    rootDir: frontend/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: DATABASE_PATH
        value: data/pro_punter.db
      - key: KELLY_MULTIPLIER
        value: "0.25"
    plan: free
